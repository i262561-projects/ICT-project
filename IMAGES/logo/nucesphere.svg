<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
<title id="title">NUCESphere logo</title><desc id="desc">An orbital sphere surrounding an abstract N, followed by the NUCESphere wordmark.</desc>
<defs>
 <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35d5ff"/><stop offset=".52" stop-color="#2777ff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
 <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39c9ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
<g transform="translate(18 15)">
 <circle cx="74" cy="74" r="57" fill="none" stroke="#a9c8ff" stroke-opacity=".45" stroke-width="5"/>
 <path d="M43 118V40l63 77V39" fill="none" stroke="#f4f8ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
 <ellipse cx="74" cy="75" rx="83" ry="29" transform="rotate(-25 74 75)" fill="none" stroke="url(#orbit)" stroke-width="10"/>
 <circle cx="143" cy="45" r="7" fill="#45d4ff"/><circle cx="13" cy="107" r="6" fill="#9b75ff"/>
</g>
<text x="190" y="111" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3" fill="#f7f9ff">NUCES</text>
<text x="410" y="111" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3" fill="url(#word)">phere</text>
</svg>